<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Action Board - Plateforme d’analyse vidéo sportive</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Action Board aide les coachs, clubs, analystes et étudiants à rendre l’analyse vidéo sportive plus accessible.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script>
    (function () {
      try {
        var match = document.cookie.match(/(?:^|; )ab_theme=([^;]+)/);
        var theme = match ? decodeURIComponent(match[1]) : 'classic';
        var allowed = ['classic', 'nocturne', 'dynamic', 'verdant', 'oriental'];
        if (allowed.indexOf(theme) === -1) theme = 'classic';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'classic');
      }
    })();
  </script>
  <script src="/runtime-config.js"></script>
</head>
<body class="mat-typography">
  <app-root></app-root>
</body>
</html>
