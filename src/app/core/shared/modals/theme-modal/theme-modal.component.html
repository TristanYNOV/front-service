<h2 mat-dialog-title class="bg-layer-3 text-default m-0">{{ 'theme.title' | transloco }}</h2>
<mat-dialog-content class="bg-layer-3 text-default">
  <p class="text-muted m-0 mb-4">
   {{ 'theme.intro' | transloco }}
  </p>

  <mat-radio-group
    class="flex flex-col gap-3"
    [value]="selectedTheme()"
    aria-label="Choix du theme"
    (change)="selectTheme($event.value)"
  >
    @for (theme of themes; track theme.value) {
      <mat-radio-button [value]="theme.value">
        <span class="flex flex-col leading-tight">
          <span class="theme-option-label text-default font-medium">{{ theme.labelKey | transloco }}</span>
          <span class="theme-option-description text-muted text-sm">{{ theme.descriptionKey | transloco }}</span>
        </span>
      </mat-radio-button>
    }
  </mat-radio-group>
</mat-dialog-content>
<mat-dialog-actions align="end" class="bg-layer-3">
  <button mat-flat-button type="button" (click)="close()">{{ 'actions.close' | transloco }}</button>
</mat-dialog-actions>
