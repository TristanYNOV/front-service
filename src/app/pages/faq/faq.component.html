<article class="public-page light-text">
  <header class="public-page__hero">
    <p class="public-page__eyebrow">{{ 'faq.eyebrow' | transloco }}</p>
    <h1>{{ 'faq.title' | transloco }}</h1>
    <p>{{ 'faq.intro' | transloco }}</p>
  </header>

  <section class="public-section faq-list" [attr.aria-label]="'faq.listLabel' | transloco">
    @for (item of items$ | async; track item.question) {
      <article class="faq-item">
        <h2>{{ item.question }}</h2>
        <p>{{ item.answer }}</p>
      </article>
    }
  </section>
</article>
