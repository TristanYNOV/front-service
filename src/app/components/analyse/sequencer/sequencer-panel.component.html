<div #panelRoot class="bg-elevated text-default flex h-full min-h-0 flex-col gap-3 p-3 text-xs">
  @if (compactMode()) {
    <div class="grid grid-cols-[auto_1fr] items-center gap-2">
      <button type="button" class="icon flex items-center p-2" [matMenuTriggerFor]="menu" aria-label="Menu actions"
              title="Menu actions">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
      <div class="text-muted text-[11px]">{{ 'panel.compactHint' | transloco }}</div>
    </div>
    <mat-menu #menu="matMenu">
      <button mat-menu-item type="button" (click)="createNewPanel()">
        <mat-icon aria-hidden="true">add_box</mat-icon>
        <span>{{ 'panel.newPanel' | transloco }}</span>
      </button>
      <button mat-menu-item type="button" (click)="openEditDescriptionDialog()">
        <mat-icon aria-hidden="true">description</mat-icon>
        <span>{{ 'panel.description' | transloco }}</span>
      </button>
      <button mat-menu-item type="button" (click)="exportPanel()">
        <mat-icon aria-hidden="true">download</mat-icon>
        <span>{{ 'actions.export' | transloco }}</span>
      </button>
      <button mat-menu-item type="button" (click)="triggerImportPanel()">
        <mat-icon aria-hidden="true">upload_file</mat-icon>
        <span>{{ 'actions.import' | transloco }}</span>
      </button>
      <button mat-menu-item type="button" (click)="savePrivatePanel()">
        <mat-icon aria-hidden="true">save</mat-icon>
        <span>{{ 'actions.save' | transloco }}</span>
      </button>
      <button mat-menu-item type="button" (click)="openPanelFinderDialog()">
        <mat-icon aria-hidden="true">search</mat-icon>
        <span>{{ 'panel.find' | transloco }}</span>
      </button>
      <button mat-menu-item type="button" (click)="openPublishDialog()">
        <mat-icon aria-hidden="true">publish</mat-icon>
        <span>{{ 'actions.publish' | transloco }}</span>
      </button>
    </mat-menu>
  } @else {
    <div class="flex items-center gap-2">
      <button type="button" class="icon p-2" [matMenuTriggerFor]="menu" aria-label="Menu actions" title="Menu actions">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item type="button" (click)="createNewPanel()">
          <mat-icon aria-hidden="true">add_box</mat-icon>
          <span>{{ 'panel.newPanel' | transloco }}</span>
        </button>
        <button mat-menu-item type="button" (click)="toggleRename()">
          <mat-icon aria-hidden="true">edit</mat-icon>
          <span>{{ 'panel.rename' | transloco }}</span>
        </button>
        <button mat-menu-item type="button" (click)="openEditDescriptionDialog()">
          <mat-icon aria-hidden="true">description</mat-icon>
          <span>{{ 'panel.description' | transloco }}</span>
        </button>
        <button mat-menu-item type="button" (click)="exportPanel()">
          <mat-icon aria-hidden="true">download</mat-icon>
          <span>{{ 'actions.export' | transloco }}</span>
        </button>
        <button mat-menu-item type="button" (click)="triggerImportPanel()">
          <mat-icon aria-hidden="true">upload_file</mat-icon>
          <span>{{ 'actions.import' | transloco }}</span>
        </button>
        <button mat-menu-item type="button" (click)="savePrivatePanel()">
          <mat-icon aria-hidden="true">save</mat-icon>
          <span>{{ 'actions.save' | transloco }}</span>
        </button>
        <button mat-menu-item type="button" (click)="openPanelFinderDialog()">
          <mat-icon aria-hidden="true">search</mat-icon>
          <span>{{ 'panel.find' | transloco }}</span>
        </button>
        <button mat-menu-item type="button" (click)="openPublishDialog()">
          <mat-icon aria-hidden="true">publish</mat-icon>
          <span>{{ 'actions.publish' | transloco }}</span>
        </button>
      </mat-menu>

      <button type="button" class="seq-btn-event icon p-2" (click)="openEventDialog()" [attr.aria-label]="'panel.createEvent' | transloco" [title]="'panel.createEvent' | transloco">
        <mat-icon aria-hidden="true">new_label</mat-icon>
      </button>
      <button type="button" class="seq-btn-label icon p-2" (click)="openLabelDialog()" [attr.aria-label]="'panel.createLabel' | transloco" [title]="'panel.createLabel' | transloco">
        <mat-icon aria-hidden="true">new_label</mat-icon>
      </button>
      <button type="button" class="seq-btn-stat icon p-2" (click)="openStatDialog()" [attr.aria-label]="'panel.createStat' | transloco" [title]="'panel.createStat' | transloco">
        <mat-icon aria-hidden="true">query_stats</mat-icon>
      </button>

      <div class="flex">
        <button type="button" class="icon p-2" (click)="toggleRename()">
          <mat-icon aria-hidden="true">edit</mat-icon>
        </button>
        @if (showRenameInput()) {
          <input
            matInput
            [value]="renameDraft()"
            (input)="onRenameInput($event)"
            (blur)="saveRename()"
            (keydown.enter)="saveRename()"
            class="text-default w-full text-[13px] font-semibold"
          />
        } @else {
          <span class="text-default w-full text-[13px] font-semibold self-center">{{ panelName() }}</span>
        }
      </div>

      <button type="button" class="icon p-2 ml-auto" (click)="toggleEditMode()" [attr.aria-label]="'panel.editMode' | transloco" [title]="'panel.editMode' | transloco">
        @if (editMode()) {
          <mat-icon aria-hidden="true">lock_open</mat-icon>
        } @else {
          <mat-icon aria-hidden="true">lock</mat-icon>
        }
      </button>

      <button type="button" class="icon p-2" (click)="savePrivatePanel()" [attr.aria-label]="'panel.savePrivate' | transloco" [title]="'actions.save' | transloco">
        <mat-icon aria-hidden="true">save</mat-icon>
      </button>

      <button type="button" class="icon p-2" (click)="openPanelFinderDialog()" [attr.aria-label]="'panel.find' | transloco" [title]="'panel.find' | transloco">
        <mat-icon aria-hidden="true">search</mat-icon>
      </button>
    </div>
  }

  <div class="min-h-0 flex-1">
    <app-sequencer-canvas
      [btnList]="sortedBtnList()"
      [editMode]="showEditIcons()"
      [activeIndefiniteIds]="activeIndefiniteIds()"
      [lastTriggeredBtnId]="lastTriggeredBtnId()"
      (triggerBtn)="onBtnClick($event)"
      (editBtn)="openEditDialog($event)"
      (deleteBtn)="deleteBtn($event)"
    ></app-sequencer-canvas>
  </div>

  <input #panelFileInput type="file" accept="application/json,.json" class="hidden" (change)="onImportPanelFileSelected($event)" />
</div>
