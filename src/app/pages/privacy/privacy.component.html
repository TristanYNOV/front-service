<article class="public-page light-text">
  <header class="public-page__hero">
    <p class="public-page__eyebrow">{{ 'privacy.eyebrow' | transloco }}</p>
    <h1>{{ 'privacy.title' | transloco }}</h1>
    <p>{{ 'privacy.intro' | transloco }}</p>
  </header>

  @for (section of sections; track section) {
    <section class="public-section">
      <h2>{{ 'privacy.' + section + 'Title' | transloco }}</h2>
      <p>{{ 'privacy.' + section + 'Text' | transloco }}</p>
    </section>
  }
</article>
